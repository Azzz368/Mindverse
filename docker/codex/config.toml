# Non-secret Codex configuration for the Mindverse Render container.
# The LETAICODE API key is injected at runtime from Render Secret Files into
# /home/node/.codex/auth.json and must never be committed here.
model_provider = "letaicode"
model = "gpt-5.5"
model_reasoning_effort = "high"
disable_response_storage = true
preferred_auth_method = "apikey"

[model_providers.letaicode]
name = "letaicode"
base_url = "https://letaicode.cn/codex"
wire_api = "responses"
requires_openai_auth = false
